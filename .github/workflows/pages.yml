name: Deploy Hat Packer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust (wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-img-lib/target
            ~/.cache
          key: rust-${{ runner.os }}-${{ hashFiles('rust-img-lib/Cargo.toml') }}
      - name: Build
        working-directory: svelte-frontend
        run: |
          npm install
          npm run build
      - name: Check build output
        run: ls -R svelte-frontend/public/build && test -f svelte-frontend/public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: svelte-frontend/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
